plugins {
    id 'com.android.application'
}

def envProps = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}

android {
    namespace 'br.com.validadepro'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.validadepro'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'SUPABASE_URL', '"' + (envProps.getProperty('SUPABASE_URL', '') ?: '') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + (envProps.getProperty('SUPABASE_ANON_KEY', '') ?: '') + '"'
        buildConfigField 'String', 'DEFAULT_COMPANY', '"Padaria Lobo"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
