plugins {
    id "com.android.application"
}

def supabaseProperties = new Properties()
def supabasePropertiesFile = rootProject.file("supabase.properties")
if (supabasePropertiesFile.exists()) {
    supabasePropertiesFile.withInputStream { supabaseProperties.load(it) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def javaString = { value ->
    String.valueOf(value == null ? "" : value)
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
}

android {
    namespace "br.com.validadelobopro"
    compileSdk 36

    defaultConfig {
        applicationId "br.com.validadelobopro"
        minSdk 23
        targetSdk 36
        versionCode 40
        versionName "1.21.7"

        buildConfigField "String", "SUPABASE_URL", "\"${javaString(supabaseProperties.getProperty("SUPABASE_URL", ""))}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${javaString(supabaseProperties.getProperty("SUPABASE_ANON_KEY", ""))}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile", ""))
                storePassword keystoreProperties.getProperty("storePassword", "")
                keyAlias keystoreProperties.getProperty("keyAlias", "")
                keyPassword keystoreProperties.getProperty("keyPassword", "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.mlkit:text-recognition:16.0.1"

    testImplementation "junit:junit:4.13.2"
}

