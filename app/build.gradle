plugins {
    id "com.android.application"
}

def supabaseProperties = new Properties()
def supabasePropertiesFile = rootProject.file("supabase.properties")
if (supabasePropertiesFile.exists()) {
    supabasePropertiesFile.withInputStream { supabaseProperties.load(it) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def javaString = { value ->
    String.valueOf(value == null ? "" : value)
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
}

android {
    namespace "br.com.validadelobopro"
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 51
        versionName "1.22.8"

        buildConfigField "String", "SUPABASE_URL", "\"${javaString(supabaseProperties.getProperty("SUPABASE_URL", ""))}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${javaString(supabaseProperties.getProperty("SUPABASE_ANON_KEY", ""))}\""
    }

    flavorDimensions "distribuicao"
    productFlavors {
        play {
            dimension "distribuicao"
            // Pacote da ficha existente no Google Play.
            applicationId "br.com.validadept260"
            buildConfigField "boolean", "GITHUB_DISTRIBUTION", "false"
        }
        github {
            dimension "distribuicao"
            // Mantém compatibilidade com os APKs já instalados pelo GitHub.
            applicationId "br.com.validadelobopro"
            buildConfigField "boolean", "GITHUB_DISTRIBUTION", "true"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(System.getenv("PT260_UPLOAD_STORE_FILE") ?: keystoreProperties.getProperty("storeFile", ""))
                storePassword System.getenv("PT260_UPLOAD_STORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword", "")
                keyAlias System.getenv("PT260_UPLOAD_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias", "")
                keyPassword System.getenv("PT260_UPLOAD_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword", "")
            }
        }
    }

    buildTypes {
        debug {
            // Instala lado a lado com a versão distribuída pela Play Store.
            applicationIdSuffix ".teste"
            versionNameSuffix "-teste"
        }
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // OCR lê o rótulo e o leitor reconhece QR/EAN localmente; ambos funcionam
    // sem enviar imagem do produto para um serviço externo.
    implementation "com.google.mlkit:barcode-scanning:17.3.0"

    testImplementation "junit:junit:4.13.2"
}
